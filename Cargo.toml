[workspace]
resolver = "2"
members = [
    "crates/zn-audio",
    "crates/zn-assets",
    "crates/zn-client",
    "crates/zn-core",
    "crates/zn-input",
    "crates/zn-launcher",
    "crates/zn-net",
    "crates/zn-physics",
    "crates/zn-render",
    "crates/zn-scene",
    "crates/zn-server",
    "crates/zn-tools/editor",
    "game/zn-content",
    "game/zn-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/zona-project/zona"
description = "ZONA — own game engine, launcher and an extraction FPS in a Strugatsky-style setting"

[workspace.dependencies]
bytemuck = "1"
egui = "0.36"
env_logger = "0.11"
glam = "0.34"
gltf = "1.4"
hecs = "0.11"
image = "0.25"
kira = "0.11"
log = "0.4"
mlua = "0.12"
pollster = "1"
rapier3d = "0.36"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
bincode = "1"
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
