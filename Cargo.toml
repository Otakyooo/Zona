[workspace]
resolver = "2"
members = [
    "crates/zn-audio",
    "crates/zn-assets",
    "crates/zn-client",
    "crates/zn-core",
    "crates/zn-input",
    "crates/zn-launcher",
    "crates/zn-net",
    "crates/zn-physics",
    "crates/zn-render",
    "crates/zn-scene",
    "crates/zn-server",
    "crates/zn-tools/editor",
    "game/zn-content",
    "game/zn-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/zona-project/zona"
description = "ZONA — own game engine, launcher and an extraction FPS in a Strugatsky-style setting"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
env_logger = "0.11"
glam = "0.34"
gltf = "1.4"
hecs = "0.11"
image = "0.25"
kira = "0.11"
ktx2 = "0.5"
log = "0.4"
mlua = "0.12"
pollster = "1"
rapier3d = "0.36"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
bincode = "1"
basisu = { version = "0.1", features = ["zstd"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
winit = "0.30"
# лаунчер (M6): доставка dev-сборок из GitHub Releases
semver = "1"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
ureq = "3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# dev-сборки для тестеров: меньше zip в квоте Releases (panic-локации
# остаются в сообщениях, теряются только символы бэктрейсов)
strip = true
