[package]
name = "zn-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ZONA launcher: channel selection, manifest-driven updates and game bootstrap (M6)"

[lib]
name = "zn_launcher"
path = "src/lib.rs"

[[bin]]
name = "zn-launcher"
path = "src/main.rs"

[dependencies]
log = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# TLS — системный (SChannel на Windows / OpenSSL на Linux), НЕ rustls:
# на сетях с DPI (ТСПУ) отпечаток ClientHello у rustls режется, и ответ
# приходит битый («failed to parse header value») — системный стек имеет
# такой же отпечаток, как браузеры, и проходит.
ureq = { workspace = true, default-features = false, features = ["gzip", "native-tls"] }
zip = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
