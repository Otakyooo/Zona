[package]
name = "zn-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ZONA dedicated server: authoritative UDP session (one process = one match)"

[lib]
name = "zn_server"
path = "src/lib.rs"

[[bin]]
name = "zn-server"
path = "src/main.rs"

[dependencies]
env_logger = { workspace = true }
log = { workspace = true }
zn-content = { path = "../../game/zn-content" }
zn-net = { path = "../zn-net" }
zn-scene = { path = "../zn-scene" }
zn-sim = { path = "../../game/zn-sim" }
