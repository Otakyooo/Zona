# NOTE: pin the linker to the rustup-bundled MinGW gcc.
# The system-wide WinLibs (Brecht Sanders) gcc configured in ~/.cargo/config.toml
# produces binaries with a broken import table (SIGSEGV in static initializers).
# For MSVC-hosted CI use the default x86_64-pc-windows-msvc toolchain instead.
[target.x86_64-pc-windows-gnu]
linker = "C:/Users/russi/.rustup/toolchains/stable-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/bin/self-contained/x86_64-w64-mingw32-gcc.exe"
