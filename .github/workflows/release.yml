name: release

# Dev-сборки: push в main → клиент (Windows) + сервер (Linux) → релиз «dev»
# с manifest.json. Обновление сервера на боксе — pull-моделью (deploy/zona-update.sh),
# deploy-job здесь намеренно нет: CI не заходит в LAN.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_override:
        description: "Форс patch-версии (hotfix-пересборка; пусто = GITHUB_RUN_NUMBER)"
        required: false
        default: ""

concurrency:
  group: release-dev
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build client
        run: cargo build --release -p zn-client -p zn-launcher
        env:
          # PAT вкомпиливается в лаунчер (option_env!) — иначе приватные
          # ассеты Releases не скачать. Secrets недоступны в fork-PR.
          ZONA_RELEASE_TOKEN: ${{ secrets.ZONA_RELEASE_TOKEN }}
          # Версия лаунчера = версия релиза (формула — как в
          # publish-dev-build.ps1: 0.1.<run_number> или build_override).
          # Уходит в LAUNCHER_VERSION лаунчера (option_env!).
          ZONA_LAUNCHER_VERSION: "0.1.${{ inputs.build_override || github.run_number }}"
      # Код-подпись (Azure Artifact Signing / Trusted Signing). Шаги пропущены,
      # пока секреты не заданы: Defender ловит неподписанные бинарники как
      # Trojan:Script/Sabsik.FL.A!ml (известный FP, см. memory 2026-10-21).
      # Для активации: секреты AZURE_TENANT_ID / AZURE_CLIENT_ID /
      # AZURE_CLIENT_SECRET / AZURE_CODE_SIGNING_ENDPOINT (например
      # https://eus.codesigning.azure.net/) / AZURE_CODE_SIGNING_ACCOUNT /
      # AZURE_CODE_SIGNING_PROFILE + роль Artifact Signing Certificate
      # Profile Signer на аккаунте. (secrets недоступен в step-if — считаем
      # output отдельным шагом.)
      - name: Check signing config
        id: signcfg
        shell: bash
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign Windows binaries (Azure Artifact Signing)
        if: steps.signcfg.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: |
            ${{ github.workspace }}\target\release\zn-launcher.exe
            ${{ github.workspace }}\target\release\zn-client.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ZONA dev build
      - name: Pack client zip
        run: |
          $stage = "dist/zona-dev-win-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/zn-client.exe $stage/
          Copy-Item target/release/zn-launcher.exe $stage/
          Copy-Item game/content $stage/content -Recurse
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $stage -DestinationPath dist/zona-dev-win-x64.zip -Force
      - name: "Pack launcher zip (M6-8: отдельный артефакт лаунчера)"
        run: |
          $stage = "dist/zona-launcher"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/zn-launcher.exe $stage/
          Compress-Archive -Path $stage -DestinationPath dist/zona-launcher-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: zona-client
          path: dist/zona-dev-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zona-launcher
          path: dist/zona-launcher-x64.zip
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server (linux, нативно — заодно верифицирует кросс-платформенность)
        run: cargo build --release -p zn-server
      - name: Pack server tar.gz
        run: |
          mkdir -p dist/zona-server-linux
          cp target/release/zn-server dist/zona-server-linux/
          cp -r game/content dist/zona-server-linux/content
          tar -czf dist/zona-server-linux-x64.tar.gz -C dist zona-server-linux
      - uses: actions/upload-artifact@v4
        with:
          name: zona-server
          path: dist/zona-server-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    runs-on: windows-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zona-client
          path: dist/client
      - uses: actions/download-artifact@v4
        with:
          name: zona-launcher
          path: dist/launcher
      - uses: actions/download-artifact@v4
        with:
          name: zona-server
          path: dist/server
      - name: Publish release
        run: pwsh -File scripts/publish-dev-build.ps1 -ClientZip dist/client/zona-dev-win-x64.zip -LauncherZip dist/launcher/zona-launcher-x64.zip -ServerTar dist/server/zona-server-linux-x64.tar.gz -BuildOverride "${{ inputs.build_override }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZONA_SERVER_ADDR: ${{ vars.ZONA_SERVER_ADDR }}
